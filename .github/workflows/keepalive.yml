name: keepalive

# 為什麼有這支：GitHub 會把「60 天沒有任何 run」的倉庫 Actions 自動停用，
# 這兩倉的正式 workflow 跑得極少，已經被自動關過、要靠人手在網頁端開回來。
# 這支每週空跑一次，只為了讓倉庫保持「有活動」，不做任何事、不佔多少額度。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "keepalive $(date -u +%F)"
